<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Office Web — Spreadsheet</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon"/>
    <script src="vendor/web-apps/apps/api/documents/api.js"></script>
    <script>window.__OO_PAGE_TYPE = "xlsx";</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; }
        #editor { flex: 1; min-height: 0; display: none; }
        iframe[name="frameEditor"] { width: 100% !important; height: 100% !important; }

        #status {
            position: fixed; top: 10px; right: 14px; z-index: 9999;
            font: 13px/1.4 system-ui, sans-serif; color: #333;
            background: rgba(255,255,255,.94); border: 1px solid #dde0e5;
            border-radius: 6px; padding: 6px 14px; box-shadow: 0 1px 5px rgba(0,0,0,.1);
            display: none;
        }
        #status.show { display: block; }
        #status.error { color: #c00; border-color: #c00; }

        /* home screen */
        #home {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; padding: 48px 24px;
            background: #f5f6f8; overflow-y: auto;
        }
        #home.dragover { background: #e8f0fe; }
        #home h1 { font-size: 26px; font-weight: 600; color: #222; margin-bottom: 6px; }
        #home .subtitle { font-size: 14px; color: #777; margin-bottom: 28px; }
        .home-actions { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 22px; border-radius: 8px; border: 1px solid #d0d4da;
            background: #fff; color: #222; font-size: 14px; cursor: pointer;
            transition: background .15s, box-shadow .15s;
        }
        .btn:hover { background: #f0f2f5; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .btn.primary { background: #2f6fed; color: #fff; border-color: #2f6fed; }
        .btn.primary:hover { background: #2559c4; }
        #file-list { width: 100%; max-width: 640px; }
        .file-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            background: #fff; border: 1px solid #e3e6ea; border-radius: 8px;
            margin-bottom: 8px; cursor: pointer; transition: box-shadow .15s;
        }
        .file-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .file-icon { font-size: 22px; }
        .file-name { flex: 1; font-size: 14px; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-meta { font-size: 12px; color: #999; white-space: nowrap; }
        .file-del {
            border: none; background: none; color: #bbb; font-size: 18px;
            cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1;
        }
        .file-del:hover { color: #c00; background: #fdecec; }
        .empty-hint { text-align: center; color: #999; font-size: 14px; padding: 32px 0; }
        #upload-input { display: none; }

        /* title bar shown above the editor while a document is open */
        #titlebar {
            display: none; flex: none; height: 44px; align-items: center; gap: 10px;
            padding: 0 12px; background: #f7f8fa; border-bottom: 1px solid #dde0e5;
            font: 13px/1.4 system-ui, sans-serif; color: #333;
        }
        #titlebar.show { display: flex; }
        #back-home {
            display: inline-flex; align-items: center; gap: 6px; flex: none;
            border: 1px solid #d0d4da; border-radius: 6px; background: #fff;
            padding: 5px 12px; font: inherit; color: #333; cursor: pointer;
        }
        #back-home:hover { background: #f0f2f5; }
        #titlebar-name {
            flex: none; max-width: 40%; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #titlebar-status {
            flex: 1; color: #777; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #titlebar-status.error { color: #c00; }
        #save-btn {
            display: inline-flex; align-items: center; flex: none;
            border: 1px solid #2f6fed; border-radius: 6px; background: #2f6fed;
            color: #fff; padding: 5px 14px; font: inherit; cursor: pointer;
        }
        #save-btn:hover { background: #2559c4; }
    </style>
</head>
<body>
    <!-- home screen: file library + open/create -->
    <div id="home">
        <h1>Office Web</h1>
        <div class="subtitle">Open, edit and save Office documents entirely in your browser.</div>
        <div class="home-actions">
            <button class="btn primary" id="upload-btn">📂 Open a file</button>
        </div>
        <div class="home-actions" id="new-actions">
            <button class="btn" data-new="docx">＋ Document</button>
            <button class="btn" data-new="xlsx">＋ Spreadsheet</button>
            <button class="btn" data-new="pptx">＋ Presentation</button>
        </div>
        <input type="file" id="upload-input"
               accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt,.odt,.ods,.odp,.csv,.rtf,.txt">
        <div id="file-list"></div>
    </div>

    <!-- title bar shown while a document is open -->
    <div id="titlebar">
        <button id="back-home" title="Back to file library">← Files</button>
        <span id="titlebar-name"></span>
        <span id="titlebar-status"></span>
        <button id="save-btn" title="Save to file library (Ctrl+S)">💾 Save</button>
    </div>

    <!-- editor container -->
    <div id="editor"></div>

    <div id="status"></div>

    <script src="store.js"></script>
    <script src="app.js"></script>
</body>
</html>
